name: Build indexed SQLite dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlite.yml'

permissions:
  contents: write

concurrency:
  group: build-second-project-sqlite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SQLite + indexes + FTS5
        run: |
          python tools/json_to_sqlite.py \
            第二プロジェクト.json.gz \
            db.sqlite

      - name: Show database info
        run: |
          python - <<'PY'
          import os, sqlite3
          p = 'db.sqlite'
          db = sqlite3.connect(p)
          print('sqlite_bytes=', os.path.getsize(p))
          print('sqlite_mib=', round(os.path.getsize(p) / 1024 / 1024, 3))
          print('rows=', db.execute('SELECT COUNT(*) FROM comments').fetchone()[0])
          print('top=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=0').fetchone()[0])
          print('replies=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=1').fetchone()[0])
          print('fts=', db.execute('SELECT COUNT(*) FROM comments_fts').fetchone()[0])
          print('quick_check=', db.execute('PRAGMA quick_check').fetchone()[0])
          print('indexes=')
          for row in db.execute("SELECT name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' ORDER BY name"):
              print(' -', row[0])
          db.close()
          PY

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Compress database as hard as possible
        run: |
          zstd --ultra -22 --long=31 -T1 -f \
            db.sqlite \
            -o db.zst
          stat -c 'zstd_bytes=%s' db.zst
          du -h db.zst

      - name: Split db.zst into exactly two parts
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('db.zst')
          size = src.stat().st_size
          cut = (size + 1) // 2

          with src.open('rb') as f:
              Path('db.zst.part0').write_bytes(f.read(cut))
              Path('db.zst.part1').write_bytes(f.read())

          limit = 100 * 1024 * 1024
          for p in (Path('db.zst.part0'), Path('db.zst.part1')):
              print(p.name, p.stat().st_size)
              if p.stat().st_size >= limit:
                  raise SystemExit(f'{p} is still >=100 MiB')
          PY

      - name: Upload db.zst artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-zstd
          path: db.zst
          compression-level: 0
          retention-days: 90

      - name: Commit split db.zst
        run: |
          set -e
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -f db.zst.part0 db.zst.part1

          if git diff --cached --quiet; then
            echo 'No split DB changes'
            exit 0
          fi

          git commit -m 'Update split indexed db.zst'

          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 2))
          done

          exit 1
