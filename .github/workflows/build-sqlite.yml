name: Build indexed SQLite dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlite.yml'

permissions:
  contents: write

concurrency:
  group: build-second-project-sqlite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SQLite + indexes + FTS5
        run: |
          python tools/json_to_sqlite.py \
            第二プロジェクト.json.gz \
            db.sqlite

      - name: Show database info
        run: |
          python - <<'PY'
          import os, sqlite3
          p = 'db.sqlite'
          db = sqlite3.connect(p)
          print('sqlite_bytes=', os.path.getsize(p))
          print('sqlite_mib=', round(os.path.getsize(p) / 1024 / 1024, 3))
          print('rows=', db.execute('SELECT COUNT(*) FROM comments').fetchone()[0])
          print('top=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=0').fetchone()[0])
          print('replies=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=1').fetchone()[0])
          print('fts=', db.execute('SELECT COUNT(*) FROM comments_fts').fetchone()[0])
          print('quick_check=', db.execute('PRAGMA quick_check').fetchone()[0])
          print('indexes=')
          for row in db.execute("SELECT name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' ORDER BY name"):
              print(' -', row[0])
          db.close()
          PY

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Compress database as hard as possible
        run: |
          zstd --ultra -22 --long=31 -T1 -f \
            db.sqlite \
            -o db.zst
          stat -c 'zstd_bytes=%s' db.zst
          du -h db.zst

      - name: Upload db.zst artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-zstd
          path: db.zst
          compression-level: 0
          retention-days: 90

      - name: Commit db.zst when it fits GitHub's 100 MiB limit
        run: |
          set -e
          FILE='db.zst'
          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((100 * 1024 * 1024))
          echo "zstd_bytes=$SIZE"
          echo "github_limit_bytes=$LIMIT"

          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "db.zst is >=100 MiB; keeping it as an Actions artifact only."
            exit 0
          fi

          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -f "$FILE"

          if git diff --cached --quiet; then
            echo 'No db.zst changes'
            exit 0
          fi

          git commit -m 'Build indexed db.zst'
          git pull --rebase origin main
          git push origin HEAD:main
