name: Build indexed SQLite dataset

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-second-project-sqlite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SQLite + indexes + FTS5
        run: |
          python tools/json_to_sqlite.py \
            第二プロジェクト.json.gz \
            第二プロジェクト.sqlite

      - name: Show database info
        run: |
          python - <<'PY'
          import os, sqlite3
          p = '第二プロジェクト.sqlite'
          db = sqlite3.connect(p)
          print('sqlite_bytes=', os.path.getsize(p))
          print('rows=', db.execute('SELECT COUNT(*) FROM comments').fetchone()[0])
          print('top=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=0').fetchone()[0])
          print('replies=', db.execute('SELECT COUNT(*) FROM comments WHERE is_reply=1').fetchone()[0])
          print('fts=', db.execute('SELECT COUNT(*) FROM comments_fts').fetchone()[0])
          print('quick_check=', db.execute('PRAGMA quick_check').fetchone()[0])
          print('indexes=')
          for row in db.execute("SELECT name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' ORDER BY name"):
              print(' -', row[0])
          db.close()
          PY

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Compress SQLite with maximum zstd level
        run: zstd --ultra -22 -T0 -f -k 第二プロジェクト.sqlite -o 第二プロジェクト.sqlite.zst

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: 第二プロジェクト-sqlite-zstd
          path: 第二プロジェクト.sqlite.zst
          compression-level: 0
          retention-days: 90

      - name: Commit compressed SQLite when it fits GitHub's normal file limit
        run: |
          set -e
          FILE='第二プロジェクト.sqlite.zst'
          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((95 * 1024 * 1024))
          echo "zstd_bytes=$SIZE"

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Zstd-compressed DB is >95 MiB; leaving it as an Actions artifact only."
            exit 0
          fi

          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -f "$FILE"

          if git diff --cached --quiet; then
            echo 'No SQLite changes'
            exit 0
          fi

          git commit -m 'Add zstd-compressed indexed SQLite dataset'
          git pull --rebase origin main
          git push origin HEAD:main
