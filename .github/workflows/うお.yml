name: Issue Image to CSS Bot (Artifact)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install image-to-pure-css
        run: npm install --ignore-scripts @kongyo2/image-to-pure-css

      - name: Process Issue Images
        env:
          # Issue bodies are untrusted input. Pass them via env instead of
          # interpolating the GitHub expression directly into the shell script.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          URLS_FILE="$(mktemp)"
          printf '%s\n' "$ISSUE_BODY" \
            | grep -oE 'https://[^[:space:]"'"'"'()]+' \
            | grep -E '^https://(github\.com/user-attachments/assets/|user-images\.githubusercontent\.com/)' \
            > "$URLS_FILE" || true

          URL_COUNT="$(wc -l < "$URLS_FILE" | tr -d ' ')"
          if [ "$URL_COUNT" -eq 0 ]; then
            echo "No supported GitHub-hosted images found in the issue"
            exit 0
          fi
          if [ "$URL_COUNT" -gt 10 ]; then
            echo "Too many images; refusing to process more than 10"
            exit 1
          fi

          mkdir -p tmp
          INDEX=0
          while IFS= read -r IMG_URL; do
            INDEX=$((INDEX + 1))
            IMAGE_PATH="tmp/image-$INDEX"
            CSS_PATH="tmp/image-$INDEX.css"

            echo "Processing GitHub-hosted image $INDEX/$URL_COUNT"
            curl --fail --location --silent --show-error \
              --proto '=https' --max-time 30 --max-filesize 10485760 \
              "$IMG_URL" -o "$IMAGE_PATH"

            npx --no-install image-to-pure-css "$IMAGE_PATH" --width 100 > "$CSS_PATH"
          done < "$URLS_FILE"

      - name: Upload CSS files as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: css-artifacts
          path: tmp/*.css
          if-no-files-found: ignore

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "CSS に変換しました。アーティファクト: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
