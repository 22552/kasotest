name: 第二集計プロジェクト

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/第二プロジェクト.yml'

permissions:
  contents: write

concurrency:
  group: second-project-main
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - name: Restore compressed cache
        run: |
          if [ -f 第二プロジェクト.json.gz ]; then
            gzip -dc 第二プロジェクト.json.gz > 第二プロジェクト.json
          fi

      - name: Run scraper4 full scan
        run: FULL_SCAN=1 go run ./scraper4.go 32970524 2000 第二プロジェクト.json

      - name: Compress JSON
        run: gzip -f 第二プロジェクト.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add 第二プロジェクト.json.gz

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update compressed data"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying ($i/5)"
            sleep $((i * 2))
          done

          echo "Push failed after 5 retries"
          exit 1
