name: genko

on:
  schedule:
    - cron: "0 */8 * * *"  # 8時間ごと（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genko-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run scraper4
        run: go run ./scraper4.go 51396308 1080 genko.json

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add genko.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update genko.json"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying ($i/5)"
            sleep $((i * 2))
          done

          echo "Push failed after 5 retries"
          exit 1
