name: genko

on:
  schedule:
    - cron: "0 */8 * * *"  # 8時間ごと（UTC）
  workflow_dispatch:       # 手動実行OK
  push:
    paths:
      - ".github/workflows/gensuta.yml"

permissions:
  contents: write

concurrency:
  group: genko-writer
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inspect Go binary
        run: |
          set -euo pipefail
          echo '=== file ==='
          file ./scraper || true
          echo '=== go version -m ==='
          go version -m ./scraper || true
          echo '=== main-ish symbols ==='
          go tool nm ./scraper 2>/dev/null | grep -Ei 'main\.|scrap|comment|repl|studio|page|offset|limit' | head -n 300 || true
          echo '=== useful strings ==='
          strings -n 5 ./scraper | grep -Ei 'api\.scratch|scratch\.mit|usage|offset|limit|datetime|username|user_id|replies|reply_count|429|retry|page|hour|minute|second|json' | head -n 500 || true

  run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make executable
        run: chmod +x ./scraper

      - name: Run scraper
        run: ./scraper 51396308 1080 genko.json

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add genko.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update genko.json"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another writer; retrying ($i/5)"
            sleep $((i * 2))
          done

          echo "Push failed after 5 retries"
          exit 1
